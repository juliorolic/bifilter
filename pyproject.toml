[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "juliorolic-bifilter"
version = "0.1.0"
description = "比对输入侧与输出侧的规则覆盖，标出只在一侧生效的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "juliorolic" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://juliorolic.github.io"
Repository = "https://github.com/juliorolic/bifilter"
Issues = "https://github.com/juliorolic/bifilter/issues"

[project.scripts]
bifilter = "bifilter:main"

[tool.setuptools]
py-modules = ["bifilter"]
